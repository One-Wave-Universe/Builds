<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One-Wave Foreman</title><style>:root{font-family:system-ui,sans-serif;color-scheme:dark;--b:#091018;--p:#101b26;--l:#2b3c4d;--t:#edf6ff;--m:#9fb0c0;--a:#75d7e8}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t)}main{max-width:1200px;margin:auto;padding:22px}header{display:flex;gap:12px;align-items:end;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:clamp(28px,5vw,52px)}.muted{color:var(--m)}button,label.btn{border:1px solid var(--l);background:var(--p);color:var(--t);padding:10px 14px;border-radius:10px;cursor:pointer}input[type=file]{display:none}.stats,.lanes{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.card{border:1px solid var(--l);background:var(--p);border-radius:14px;padding:14px}.n{font-size:28px;font-weight:800}.lane h2{margin:0 0 4px;font-size:18px}.job{border-top:1px solid var(--l);padding:11px 0}.job:first-of-type{border-top:0}.state{font-size:11px;letter-spacing:.08em;color:var(--a)}.bad{color:#ffb3a7}.receipt{color:#b7e3ba;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.canon{font-size:11px;color:var(--m);overflow-wrap:anywhere}</style></head><body><main><header><div><div class="muted">One-Wave project control</div><h1>Foreman Workstation</h1><div id="stamp" class="muted"></div></div><div class="toolbar"><label class="btn">Import registry<input id="file" type="file" accept=".json"></label><button id="export">Export registry</button><button id="reset">Reset</button></div></header><section id="stats" class="stats"></section><section id="lanes" class="lanes"></section><p class="muted">DONE requires a receipt. BLOCKED requires a blocker. Canonical references are shown per lane so workers know what to load before editing.</p></main><script id="seed" type="application/json">{"schema":"one-wave-foreman/v1","project":"One-Wave","updated":"2026-09-28","lanes":[{"id":"cell","name":"CELL / Analog Build","repo":"One-Wave-Universe/Builds","canon":["cell-v1/CELL_V1_2026-09-28_CORRECTION.md","maps/CELL_V1_CONCEPT_MAP.md"],"goal":"Use digital/reference tests to constrain and validate the physical CELL."},{"id":"digital","name":"Digital Brain","repo":"One-Wave-Universe/Builds","canon":["maps/DIGITAL_CELL_TWO_STATE_BRAIN_LADDER.md","maps/SENSORY_CORTEX_DC_AC_RC_PROGRAM.md"],"goal":"Build digital CELL→worker→brain reference ladder and analog comparison twin."},{"id":"senses","name":"Senses / Cortex","repo":"One-Wave-Universe/Builds","canon":["maps/SENSORY_CORTEX_DC_AC_RC_PROGRAM.md","maps/ANDROID_CELL_TO_CORTEX_MAP.md"],"goal":"Real Jetson hearing/vision plus simulated dreamscape adapters."},{"id":"animator","name":"Animator","repo":"One-Wave-Universe/Builds","canon":["maps/ANIMATOR_PRODUCT_MAP.md"],"goal":"Deliver the frame-by-frame desktop animation acceptance path."},{"id":"science","name":"Science / 24→1","repo":"One-Wave-Universe/One-Wave-Science","canon":["chapters/05_Simulation_Engine.md","sims/24-1-sandbox/GOLD_STANDARD.md"],"goal":"Modular visual + scientific simulations with gold validation."},{"id":"bridge","name":"Bridges / Jetson","repo":"One-Wave-Universe/Bridge-Comand","canon":[],"goal":"Keep machine/worker routes healthy with matching execution receipts."}],"jobs":[{"id":"W-010","lane":"digital","title":"L0 Digital Cell","state":"PRIMED","issue":6,"depends":[],"acceptance":["explicit FIELD/VOID","ternary HOLD","deterministic replay","JSON/JSONL receipts"],"receipts":[],"blockers":[]},{"id":"W-011-012","lane":"digital","title":"Parser + Validator Cells","state":"IDLE","issue":7,"depends":["W-010"],"acceptance":["parser receipt","PASS/HOLD/REJECT","no fabricated evidence"],"receipts":[],"blockers":["W-010"]},{"id":"W-103","lane":"senses","title":"Jetson audio capture/replay","state":"PRIMED","issue":3,"depends":[],"acceptance":["timestamped PCM","checksum","deterministic replay","latency/drop receipt"],"receipts":[],"blockers":[]},{"id":"W-104","lane":"senses","title":"Jetson camera capture/replay","state":"PRIMED","issue":4,"depends":[],"acceptance":["timestamped frames","checksum","deterministic replay","latency/drop receipt"],"receipts":[],"blockers":[]},{"id":"W-305","lane":"senses","title":"Dreamscape sensory adapter","state":"IDLE","issue":5,"depends":["W-004"],"acceptance":["SOURCE simulated","seeded replay","ground truth separate","closed loop"],"receipts":[],"blockers":["W-004 sensory schema"]},{"id":"S-24-1","lane":"science","title":"24→1 sandbox migration","state":"EXECUTING","depends":[],"acceptance":["common module contract","2D visual","3D when meaningful","headless validation","gold receipts"],"receipts":["Builds coordination map; Science wrapper committed"],"blockers":[]},{"id":"C-DTWIN","lane":"cell","title":"Digital↔Analog CELL comparison harness","state":"IDLE","depends":["W-010"],"acceptance":["same stimulus schema","digital trace","bench trace","difference receipt","parameter/version provenance"],"receipts":[],"blockers":["W-010","physical bench trace adapter"]},{"id":"A-ACCEPT","lane":"animator","title":"Animator acceptance fixture","state":"IDLE","depends":[],"acceptance":["install/open/build/save/reopen/play/export"],"receipts":[],"blockers":[]}]}</script><script>const root={};const seed=JSON.parse(document.querySelector("#seed").textContent);let data=structuredClone(seed);const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));function render(){document.querySelector("#stamp").textContent="Registry "+data.updated;const states={};data.jobs.forEach(j=>states[j.state]=(states[j.state]||0)+1);document.querySelector("#stats").innerHTML='<div class="card"><div class="n">'+data.jobs.length+'</div><div class="muted">tracked jobs</div></div>'+Object.entries(states).map(([k,v])=>'<div class="card"><div class="n">'+v+'</div><div class="muted">'+esc(k)+'</div></div>').join("");document.querySelector("#lanes").innerHTML=data.lanes.map(l=>{const js=data.jobs.filter(j=>j.lane===l.id);return '<article class="card lane"><h2>'+esc(l.name)+'</h2><div class="muted">'+esc(l.goal)+'</div><div class="canon">Canon: '+(l.canon.map(esc).join(" · ")||"adapter pending")+'</div>'+js.map(j=>'<div class="job"><div class="state '+(j.state==="BLOCKED"?"bad":"")+'">'+esc(j.state)+' · '+esc(j.id)+'</div><strong>'+esc(j.title)+'</strong><div class="muted">Depends: '+(j.depends.length?j.depends.map(esc).join(", "):"none")+'</div>'+(j.blockers.length?'<div class="bad">Blocked by: '+j.blockers.map(esc).join(", ")+'</div>':"")+(j.receipts.length?'<div class="receipt">Receipt: '+j.receipts.map(esc).join(" · ")+'</div>':"")+'</div>').join("")+'</article>'}).join("")}document.querySelector("#file").addEventListener("change",async e=>{const f=e.target.files[0];if(!f)return;try{const x=JSON.parse(await f.text());if(!Array.isArray(x.lanes)||!Array.isArray(x.jobs))throw Error();data=x;render()}catch{alert("Invalid Foreman registry")}});document.querySelector("#export").addEventListener("click",()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.download="one-wave-foreman-registry.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});document.querySelector("#reset").addEventListener("click",()=>{data=structuredClone(seed);render()});render();</script></body></html>
