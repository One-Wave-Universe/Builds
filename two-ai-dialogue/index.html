<!doctype html><html><head><meta charset="utf-8"><title>Two-AI Dialogue</title><style>
body{margin:0;background:#111;color:#eee;font:14px system-ui}#box{position:fixed;right:24px;bottom:24px;width:min(720px,calc(100vw - 48px));height:min(720px,calc(100vh - 48px));background:#1b1b1b;border:1px solid #555;border-radius:16px;box-shadow:0 12px 50px #000;display:flex;flex-direction:column;overflow:hidden}.bar{padding:12px 16px;border-bottom:1px solid #444;display:flex;justify-content:space-between}.feed{flex:1;overflow:auto;padding:12px}.turn{padding:10px;margin:8px 0;border:1px solid #444;border-radius:10px}.meta{opacity:.7;font-size:12px}.input{display:flex;gap:8px;padding:12px;border-top:1px solid #444}textarea{flex:1;min-height:56px;background:#101010;color:#fff;border:1px solid #555;border-radius:8px;padding:8px}button{padding:8px 14px}.status{padding:0 12px 10px;opacity:.8}
</style></head><body><div id="box"><div class="bar"><b>FIELD ⇄ VOID · ChatGPT ⇄ Gemini</b><span id="state">IDLE</span></div><div id="feed" class="feed"></div><div class="status" id="status">Enter a question. Live adapters connect through Bridge-Comand.</div><div class="input"><textarea id="q" placeholder="Question"></textarea><button id="run">Run</button><button id="stop">Stop</button></div></div>
<script>
let stopped=false; const feed=document.querySelector('#feed'),state=document.querySelector('#state');
function add(actor,text,meta=''){let d=document.createElement('div');d.className='turn';d.innerHTML='<b>'+actor+'</b><div></div><div class="meta"></div>';d.children[1].textContent=text;d.children[2].textContent=meta;feed.append(d);feed.scrollTop=feed.scrollHeight}
document.querySelector('#run').onclick=()=>{stopped=false;feed.innerHTML='';state.textContent='READY';add('SYSTEM','Dialogue controller ready. Submit through the authenticated adapter service; no API keys belong in this page.','bounded dialogue / receipt required')};
document.querySelector('#stop').onclick=()=>{stopped=true;state.textContent='STOPPED';add('SYSTEM','Loop stopped by user.')};
async function runLive(){const q=document.querySelector('#q').value.trim();if(!q)return;stopped=false;feed.innerHTML='';state.textContent='RUNNING';try{const r=await fetch('/v1/dialogue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,max_turns:8})});const x=await r.json();for(const t of (x.turns||[]))add(t.actor,t.answer,'settled: '+(t.settled||[]).join(', ')+' | unresolved: '+(t.unresolved||[]).join(', '));state.textContent=x.status||'HOLD';if(x.final)add('FINAL',x.final)}catch(e){state.textContent='HOLD';add('SYSTEM','Live adapter unavailable: '+e.message)}}
document.querySelector('#run').onclick=runLive;
</script></body></html>
