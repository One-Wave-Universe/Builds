name: Dialogue Request
on:
  push:
    paths:
      - 'two-ai-dialogue/requests/**'
      - 'two-ai-dialogue/loop.py'
      - '.github/workflows/dialogue-request.yml'
permissions:
  contents: read

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
jobs:
  validate-request:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate dialogue requests
        run: |
          python3 - <<'PY'
          import json, glob
          paths=glob.glob("two-ai-dialogue/requests/*.json")
          assert paths, "no dialogue request"
          for p in paths:
              x=json.load(open(p))
              assert x.get("id"), "request id required"
              assert x.get("question"), "question required"
              assert 2 <= int(x.get("max_turns", 4)) <= 20
              assert x.get("actors")==["CHATGPT","GEMINI"]
              print("DIALOGUE_REQUEST_OK",x["id"])
          PY
      - name: Select triggering request
        id: request
        run: |
          REQUEST=$(git diff --name-only HEAD^ HEAD -- 'two-ai-dialogue/requests/*.json' | tail -1)
          if [ -z "$REQUEST" ]; then
            echo "No changed dialogue request found; refusing stale fallback"
            exit 2
          fi
          echo "path=$REQUEST" >> "$GITHUB_OUTPUT"
          echo "Executing request: $REQUEST"
      - name: Checkout requested peer-review repository
        uses: actions/checkout@v4
        with:
          repository: One-Wave-Universe/One-Wave-Science
          path: peer-repo
          fetch-depth: 1
      - name: Build repository evidence pack when requested
        run: |
          REQUEST="${{ steps.request.outputs.path }}"
          ROOT=$(python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); print(x.get("repo_read",{}).get("root",""))' "$REQUEST")
          QUERY=$(python3 -c 'import json,sys; x=json.load(open(sys.argv[1])); print(x.get("repo_read",{}).get("query",""))' "$REQUEST")
          if [ -n "$ROOT" ] && [ -n "$QUERY" ]; then
            test -d "$ROOT" || { echo "Requested repo root unavailable: $ROOT"; exit 3; }
            python3 two-ai-dialogue/repo_reader.py --root "$ROOT" --query "$QUERY" --output repo-evidence.json
            python3 - "$REQUEST" <<'PY'
import json,sys
p=sys.argv[1]; x=json.load(open(p)); x["evidence_pack"]="repo-evidence.json"
open(p,"w").write(json.dumps(x))
PY
          fi
      - name: Gemini live peer
        run: |
          python3 two-ai-dialogue/gemini_adapter.py "${{ steps.request.outputs.path }}" | tee gemini-receipt.json
      - name: OpenAI live peer
        if: ${{ env.OPENAI_API_KEY != '' }}
        run: |
          python3 two-ai-dialogue/openai_adapter.py "${{ steps.request.outputs.path }}" | tee openai-receipt.json
      - uses: actions/upload-artifact@v4
        with:
          name: peer-dialogue-receipts
          path: |
            gemini-receipt.json
            openai-receipt.json
            repo-evidence.json
