name: Grounded Peer Dialogue

'on':
  push:
    paths:
      - two-ai-dialogue/requests/**

permissions:
  contents: read

jobs:
  grounded-peer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout Builds control plane
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select and validate exact changed request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="$(git diff --name-only HEAD^ HEAD -- 'two-ai-dialogue/requests/*.json' | tail -n 1)"
          test -n "$REQUEST" || { echo "No changed request in triggering commit"; exit 2; }
          python3 - "$REQUEST" <<'PY'
import json,sys
p=sys.argv[1]
x=json.load(open(p))
assert x.get("id"), "request id required"
assert x.get("question"), "question required"
assert x.get("actors")==["CHATGPT","GEMINI"], "actors contract"
rr=x.get("repo_read")
assert isinstance(rr,dict), "repo_read required for grounded lane"
assert rr.get("repository")=="One-Wave-Universe/One-Wave-Science", "unsupported peer repository"
assert rr.get("root")=="peer-repo", "repo root must be peer-repo"
assert rr.get("query"), "repo_read query required"
print("REQUEST_OK",x["id"])
PY
          echo "path=$REQUEST" >> "$GITHUB_OUTPUT"

      - name: Checkout requested Science repository
        uses: actions/checkout@v4
        with:
          repository: One-Wave-Universe/One-Wave-Science
          path: peer-repo
          fetch-depth: 1

      - name: Build provenance-bearing evidence pack
        shell: bash
        run: |
          set -euo pipefail
          REQUEST="${{ steps.request.outputs.path }}"
          QUERY="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["repo_read"]["query"])' "$REQUEST")"
          python3 two-ai-dialogue/repo_reader.py \
            --root peer-repo \
            --query "$QUERY" \
            --output repo-evidence.json
          python3 - "$REQUEST" <<'PY'
import json,sys
p=sys.argv[1]
x=json.load(open(p))
x["evidence_pack"]="repo-evidence.json"
open(p,"w").write(json.dumps(x))
PY
          python3 - <<'PY'
import json
e=json.load(open("repo-evidence.json"))
assert e["files"], "evidence pack empty"
assert e["commit"], "peer commit missing"
print("EVIDENCE_OK",e["commit"],len(e["files"]))
for f in e["files"]:
    print("READABLE_PATH",f["path"])
PY

      - name: Gemini grounded peer review
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GEMINI_API_KEY:-}" || { echo "GEMINI_API_KEY missing"; exit 3; }
          python3 two-ai-dialogue/gemini_adapter.py "${{ steps.request.outputs.path }}" | tee gemini-receipt.json
          python3 - <<'PY'
import json
r=json.load(open("gemini-receipt.json"))
assert r["status"]=="COMPLETE", r
assert r["request_id"], "request id missing"
print("GEMINI_RECEIPT_OK",r["request_id"],r["turn"]["model"])
PY

      - name: Upload grounded review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grounded-peer-review
          if-no-files-found: warn
          path: |
            repo-evidence.json
            gemini-receipt.json
